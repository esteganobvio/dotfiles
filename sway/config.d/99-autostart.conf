#
exec systemctl --user import-environment

exec --no-startup-id noctalia

exec --no-startup-id wl-paste --type text --watch clipman store --no-persist
exec --no-startup-id wl-paste --type image --watch clipman store --no-persist

# KeepassXC
exec --no-startup-id flatpak run org.keepassxc.KeePassXC --minimized
exec --no-startup-id flatpak run com.github.wwmm.easyeffects --service-mode --hide-window
