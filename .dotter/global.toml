[helpers]

[fuzzel.files]
fuzzel = "~/.config/fuzzel"

[xdg-desktop-portal.files]
xdg-desktop-portal = "~/.config/xdg-desktop-portal"

[sway]
depends = ["xdg-desktop-portal", "fuzzel", "systemd-user"]

[sway.files]
sway = "~/.config/sway"


[niri]
depends = ["xdg-desktop-portal", "fuzzel", "systemd-user"]

[niri.files]
niri = "~/.config/niri"

[hyprland]
depends = ["systemd-user"]

[hyprland.files]
hypr = "~/.config/hypr"

[systemd-user.files]
systemd-user = "~/.config/systemd/user"

[gammastep.files]
gammastep = "~/.config/gammastep/config.ini"

# Desktop shell
[noctalia.files]
noctalia = "~/.config/noctalia"

# Terminals
[alacritty.files]
alacritty = "~/.config/alacritty/alacritty.toml"

[tmux.files]
tmux = "~/.tmux.conf"

[wezterm.files]
"wezterm.lua" = "~/.wezterm.lua"

[ghostty.files]
ghostty = "~/.config/ghostty"

[kitty.files]
kitty = "~/.config/kitty/kitty.conf"

[zsh.files]
zshrc = "~/.zshrc"
zshenv = "~/.zshenv"
zprofile = "~/.zprofile"
profile = "~/.profile"

[nvim.files]
nvim = "~/.config/nvim"

[nvim.variables]

# Default
[default]
depends = ["zsh", "nvim", "tmux"]

[default.files]

[default.variables]
